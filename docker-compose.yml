# ============================================================================
# AccessGuard — Full Stack Multi-Container Orchestration
# ============================================================================
# PostgreSQL 16 + FastAPI Backend + React 19 Frontend + pgAdmin
# ============================================================================

services:
  # --------------------------------------------------------------------------
  # PostgreSQL 16 Database
  # --------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: accessguard-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: accessguard
      POSTGRES_PASSWORD: accessguard
      POSTGRES_DB: accessguard
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U accessguard -d accessguard"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # --------------------------------------------------------------------------
  # FastAPI Backend (Python 3.12, asyncpg, SQLAlchemy 2.0)
  # --------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: accessguard-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://accessguard:accessguard@db:5432/accessguard
      DEBUG: "true"
      ALLOWED_ORIGINS: '["http://localhost:5173","http://localhost:3000"]'
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app  # Hot-reload in development
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # --------------------------------------------------------------------------
  # React / Next.js Frontend (Node 24, Vite / Vinext, Tailwind CSS)
  # --------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: accessguard-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules

  # --------------------------------------------------------------------------
  # pgAdmin Database Dashboard
  # --------------------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: accessguard-pgadmin
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@accessguard.local
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"

volumes:
  postgres_data:
    driver: local
